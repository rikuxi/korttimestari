<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Odds Calculator — Monte Carlo Simulator | Korttimestari</title>
    <meta name="description" content="Free poker odds calculator: Texas Hold'em, Omaha, 5-card Omaha and Omaha Hi/Lo, 2–10 players. Monte Carlo simulation in your browser, exact precomputed preflop equities and hand distributions.">
    <meta property="og:title" content="Korttimestari — poker odds calculator">
    <meta property="og:description" content="Simulate win probabilities for Hold'em, Omaha, Omaha5 and Omaha Hi/Lo hands and browse exact preflop rankings.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/images/korttimestari.png">
    <meta property="og:locale" content="en_GB">
    <meta property="og:locale:alternate" content="fi_FI">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#f4f4f4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#12161c" media="(prefers-color-scheme: dark)">
    <!-- Before body so a stored dark theme does not flash white -->
    <script src="/js/theme.js"></script>
</head>
<body>
    <div class="main-logo-container">
        <a class="main-logo-link" href="/en/" title="Home">
            <img src="/images/korttimestari_kasvot2.png" alt="Korttimestari logo" class="main-logo">
        </a>
    </div>
    <div class="container">
        <header class="site-header">
            <h1>Monte Carlo Poker Simulator</h1>
            <nav class="page-nav" aria-label="Page navigation">
                <span class="nav-group">
                    <a class="nav-link nav-link-primary" href="/en/rankings">Preflop hand rankings<span class="nav-arrow" aria-hidden="true">→</span></a>
                    <a class="nav-link" href="/en/methods">Methods</a>
                </span>
                <span class="nav-divider" aria-hidden="true"></span>
                <span class="nav-group">
                    <span class="lang-switch" role="group" aria-label="Language">
                        <a class="lang-other" href="/" lang="fi" hreflang="fi" title="Suomeksi">FI</a>
                        <span class="lang-current" aria-current="true">EN</span>
                    </span>
                    <button type="button" id="themeToggle" class="theme-toggle" aria-pressed="false" aria-label="Toggle light and dark theme" title="Light / dark theme">
                        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    </button>
                </span>
            </nav>
        </header>

        <div class="settings">
            <div class="setting-group">
                <label for="playerCount">Number of players:</label>
                <select id="playerCount">
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="simulationCount">Number of simulations:</label>
                <input type="number" id="simulationCount" min="100" max="1000000" value="10000">
            </div>

            <div class="setting-group game-selection">
                <label>Game type:</label>
                <div class="radio-group game-type-group">
                    <div class="background-highlight"></div>
                    <label class="radio-label">
                        <input type="radio" name="gameType" value="holdem" checked>
                        <span>Texas</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="gameType" value="omaha">
                        <span>Omaha</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="gameType" value="omaha5">
                        <span>Omaha5</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="gameType" value="omahahilo">
                        <span>Hi/Lo</span>
                    </label>
                </div>
            </div>

            <div class="setting-group">
                <label>Opponents:</label>
                <div class="radio-group">
                    <div class="background-highlight"></div>
                    <label class="radio-label">
                        <input type="radio" name="opponentMode" value="fixed" checked>
                        <span>Selected</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="opponentMode" value="random">
                        <span>Unknown</span>
                    </label>
                </div>
            </div>

            <!-- Shown only in "Unknown opponents" mode: sets every
                 opponent's hand range at once (ranges.js) -->
            <div class="setting-group range-setting" id="rangeSetting" hidden>
                <label for="rangeAll">Opponent hand range:</label>
                <div class="range-all">
                    <input type="range" id="rangeAll" min="1" max="100" step="1" value="100">
                    <span id="rangeAllValue" class="range-all-value">All hands</span>
                </div>
            </div>
        </div>

        <!-- New card deck section -->
        <div class="card-deck-container">
            <div class="deck-header">
                <div class="deck-heading">
                    <h3>Card deck</h3>
                    <p class="deck-instructions">Double-click, drag, or use the keyboard (Tab + Enter) to place cards into players' hands</p>
                </div>
                <div class="setting-group deck-color-selection">
                    <label>Deck colors:</label>
                    <div class="radio-group">
                        <div class="background-highlight"></div>
                        <label class="radio-label">
                            <input type="radio" name="deckColor" value="standard" checked>
                            <span>2-color</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="deckColor" value="fourcolor">
                            <span>4-color</span>
                        </label>
                    </div>
                </div>
            </div>
            <div id="cardDeck" class="card-deck"></div>
        </div>

        <div id="playersContainer" class="players-container">
            <!-- Player cards inputs will be dynamically added here -->
        </div>

        <div class="actions">
            <button id="randomizeCards" class="secondary-button">Deal random cards</button>
            <button id="runSimulation">Run simulation</button>
        </div>
        <div class="actions">
            <div id="loadingIndicator" class="loading invisible">
                <span class="loading-text">Simulating...</span>
                <span class="loading-progress"></span>
            </div>
            <button id="cancelSimulation" class="secondary-button invisible">Cancel</button>
        </div>
        <div id="simulationNotice" class="simulation-notice"></div>
    </div>

    <script src="/js/i18n.js"></script>
    <script src="/js/ranges.js"></script>
    <script src="/js/script.js"></script>
</body>
</html>
